[project]
name = "atlas-enterprise-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.2",
    "fastapi>=0.162.6",
    "glassflow-rius>=1.5.6",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.21",
    "pinecone>=10.3.0",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
atlas-enterprise-ai = "atlas_enterprise_ai:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
